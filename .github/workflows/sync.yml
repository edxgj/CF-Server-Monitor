name: Upstream Sync

permissions:
  contents: write

on:
  # Hard reset sync is disabled. It would replace the customized admin page.
  # Use "Sync upstream and keep admin theme" for manual or scheduled updates.
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Redirect to theme-preserving sync
    runs-on: ubuntu-latest
    steps:
      - name: Do not hard-reset the fork
        run: |
          echo "This workflow no longer force-syncs upstream."
          echo "Run the workflow named Sync upstream and keep admin theme instead."
          echo "A hard reset would overwrite src/frontend/styles/admin-modern.css and the admin page."
          exit 1
